services:
  postgres:
    image: postgres:16
    container_name: payledger-postgres
    restart: always
    environment:
      POSTGRES_DB: payledger_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - payledger_postgres_data:/var/lib/postgresql/data

volumes:
  payledger_postgres_data: